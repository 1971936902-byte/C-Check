worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Request URLs can contain Guacamole tokens; never persist query strings.
    map $uri $safe_uri { ~^/guacamole/api/tokens/.+ /guacamole/api/tokens/REDACTED; default $uri; }
    log_format safe '$remote_addr [$time_local] "$request_method $safe_uri" $status';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls.crt;
        ssl_certificate_key /etc/nginx/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        location = / { return 302 /guacamole/; }
        location /guacamole/ {
            set $guacamole_upstream guacamole:8080;
            proxy_pass http://$guacamole_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
